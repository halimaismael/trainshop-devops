name: TrainShop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  docker-test:
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t trainshop-api ./api

      - name: Show Docker images
        run: docker images

      - name: Run container
        run: docker run -d -p 3000:3000 --name api trainshop-api

      - name: Wait startup
        run: sleep 5

      - name: Test /health
        run: curl -f http://localhost:3000/health

      - name: Test /ready
        run: curl -f http://localhost:3000/ready
        
      - name: Test /products
        run: curl -f http://localhost:3000/products

      - name: Test /metrics
        run: curl -f http://localhost:3000/metrics

      - name: Show Docker containers
        if: failure()
        run: docker ps -a

      - name: Show container logs
        if: failure()
        run: docker logs api

      - name: Show /health response
        if: failure()
        run: curl http://localhost:3000/health || true

      - name: Show /ready response
        if: failure()
        run: curl http://localhost:3000/ready || true

      - name: Show /metrics response
        if: failure()
        run: curl http://localhost:3000/metrics || true

      - name: Show metrics
        run: curl http://localhost:3000/metrics

      - name: Show Docker stats
        run: docker stats --no-stream

      - name: Show running containers
        run: docker ps

      - name: Show API logs
        run: docker logs api

      - name: Cleanup
        if: always()
        run: docker rm -f api